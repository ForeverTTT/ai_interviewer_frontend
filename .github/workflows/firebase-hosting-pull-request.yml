# Firebase Hosting previews are deployed from
# ForeverTTT/ai_interviewer_backend/frontend, not this legacy repository.
name: Verify legacy frontend build on PR
on: pull_request
permissions:
  contents: read
jobs:
  build:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npm ci && npm run build
