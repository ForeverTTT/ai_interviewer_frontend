<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="title desc">
  <title id="title">FlowLab 2D shell mark — white face</title>
  <desc id="desc">A rounded white eggshell character with a warm yellow cracked crown, two dark eyes, and two yellow motion rays.</desc>
  <style>
    :root { --yolk:#FFD864; --shell:#FFF8E9; --edge:#E8DDC9; --ink:#26252B; }
  </style>
  <g id="signal" fill="var(--yolk)">
    <rect x="78" y="6" width="9" height="22" rx="4.5" transform="rotate(17 82.5 17)"/>
    <rect x="96" y="19" width="9" height="20" rx="4.5" transform="rotate(47 100.5 29)"/>
  </g>
  <path id="shell-body" fill="var(--shell)" stroke="var(--edge)" stroke-width="2.5" d="M64 17c26 0 45 20 46 49 1 34-17 53-46 53S17 99 18 66c1-29 20-49 46-49Z"/>
  <path id="yellow-crown" fill="var(--yolk)" d="M26 54c5-22 19-34 38-34 20 0 35 13 39 37-8 5-14-5-22-1-8 5-13 14-23 9-8-3-12-15-20-12-5 2-8 2-12 1Z"/>
  <path id="crack-rim" fill="none" stroke="var(--edge)" stroke-width="2.5" stroke-linecap="round" d="M25 55c5 2 9 1 13-1 8-3 12 9 20 12 10 5 15-4 23-9 8-4 14 6 23 1"/>
  <g id="face" fill="var(--ink)">
    <rect x="47" y="69" width="8" height="17" rx="4"/>
    <rect x="73" y="69" width="8" height="17" rx="4"/>
  </g>
</svg>
