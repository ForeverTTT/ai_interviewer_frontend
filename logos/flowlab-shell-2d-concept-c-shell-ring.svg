<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="title desc">
  <title id="title">FlowLab 2D shell mark — shell ring</title>
  <desc id="desc">A compact yellow face enclosed by a bold white shell ring, designed for very small app-icon use.</desc>
  <style>
    :root { --core:#FFD864; --shell:#FFF8E9; --edge:#E8DDC9; --ink:#26252B; }
  </style>
  <g id="signal" fill="var(--core)">
    <rect x="78" y="7" width="9" height="21" rx="4.5" transform="rotate(17 82.5 17.5)"/>
    <rect x="96" y="19" width="9" height="19" rx="4.5" transform="rotate(47 100.5 28.5)"/>
  </g>
  <path id="shell-ring" fill="var(--shell)" stroke="var(--edge)" stroke-width="2.5" fill-rule="evenodd" d="M64 20c27 0 47 20 47 48s-20 48-47 48-47-20-47-48 20-48 47-48Zm0 16c-18 0-31 13-31 32s13 32 31 32 31-13 31-32-13-32-31-32Z"/>
  <ellipse id="core" cx="64" cy="68" rx="32" ry="33" fill="var(--core)"/>
  <path id="shell-bite" fill="var(--shell)" stroke="var(--edge)" stroke-width="2.5" stroke-linejoin="round" d="M34 50c7 4 12-6 20-2 8 4 10 13 20 10 7-2 12-10 20-5-5-12-16-19-30-19-13 0-24 6-30 16Z"/>
  <g id="face" fill="var(--ink)">
    <rect x="49" y="64" width="8" height="16" rx="4"/>
    <rect x="71" y="64" width="8" height="16" rx="4"/>
  </g>
</svg>
