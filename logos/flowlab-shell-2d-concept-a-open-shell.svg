<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="title desc">
  <title id="title">FlowLab 2D shell mark — open shell</title>
  <desc id="desc">A warm yellow hatchling held between two white eggshell pieces, with two dark seed-shaped eyes and two yellow motion rays.</desc>
  <style>
    :root { --core:#FFD864; --shell:#FFF8E9; --edge:#E8DDC9; --ink:#26252B; }
  </style>
  <g id="signal" fill="var(--core)">
    <rect x="76" y="5" width="9" height="22" rx="4.5" transform="rotate(17 80.5 16)"/>
    <rect x="94" y="17" width="9" height="20" rx="4.5" transform="rotate(46 98.5 27)"/>
  </g>
  <path id="core" fill="var(--core)" d="M28 57C30 35 45 22 64 22c21 0 37 15 38 38l7 22-18 26H37L19 83l9-26Z"/>
  <path id="upper-shell" fill="var(--shell)" stroke="var(--edge)" stroke-width="2.5" stroke-linejoin="round" d="M29 49C33 26 47 14 65 14c20 0 35 14 38 38-9 5-17-4-25 0-8 4-13 12-23 8-8-3-12-14-20-12-2 1-4 1-6 1Z"/>
  <path id="lower-shell" fill="var(--shell)" stroke="var(--edge)" stroke-width="2.5" stroke-linejoin="round" d="M18 78c9-7 16 5 25 0 9-6 17 8 27 1 9-6 17 5 25 0 6-4 11 1 15 6-4 21-22 34-46 34-25 0-43-14-46-41Z"/>
  <g id="face" fill="var(--ink)">
    <rect x="48" y="57" width="8" height="16" rx="4"/>
    <rect x="72" y="57" width="8" height="16" rx="4"/>
  </g>
</svg>
