<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/brand/flowlab-felt-base-body-v1.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#F5F6F2" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0E141A" media="(prefers-color-scheme: dark)" />
    <meta name="description" content="不卡壳实验室 FlowLab — 为毕业生打造的 AI 面试、简历与求职成长平台" />
    <title>不卡壳实验室 FlowLab — 面试不再卡壳</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300..800;1,9..40,400..800&family=Fraunces:ital,opsz,wght,SOFT@0,9..144,300..700,0..100;1,9..144,300..700,0..100&family=Noto+Sans+SC:wght@400;500;700&family=Noto+Serif+SC:wght@500;600;700&display=swap" rel="stylesheet">
    <script>
      (function () {
        try {
          // 与 ThemeContext 的存储键保持一致，避免深色用户首帧闪白
          var dark = localStorage.getItem('interviewde_theme') === 'dark'
          document.documentElement.classList.toggle('dark', dark)
          document.documentElement.style.colorScheme = dark ? 'dark' : 'light'
        } catch (e) { /* ignore */ }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
