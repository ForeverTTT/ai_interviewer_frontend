<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/landit-icon-light.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="AI模拟面试平台，专为赴德实习求职者设计" />
    <title>LandIt - AI德国面试训练营</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Source+Serif+4:opsz,wght@8..60,600;700&display=swap" rel="stylesheet">
    <script>
      (function () {
        try {
          var path = (location.pathname || '/').replace(/\/+$/, '') || '/'
          var onInterview = path === '/interview'
          var app = localStorage.getItem('interviewde_app_theme')
          var inv = localStorage.getItem('interviewde_interview_theme')
          var dark = onInterview ? inv !== 'light' : app === 'dark'
          document.documentElement.classList.toggle('dark', dark)
          document.documentElement.style.colorScheme = dark ? 'dark' : 'light'
        } catch (e) { /* ignore */ }
      })()
    </script>
  <style>[style*="opacity"]{opacity:1 !important}</style>
</head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
