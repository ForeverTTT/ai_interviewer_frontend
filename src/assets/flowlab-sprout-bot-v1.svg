<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="flowlab-sprout-title flowlab-sprout-desc">
  <title id="flowlab-sprout-title">FlowLab 破壳嫩芽 Bot</title>
  <desc id="flowlab-sprout-desc">一颗长出双叶的嫩芽 Bot 从浅紫色蛋壳中破壳而出</desc>

  <!-- Left leaf -->
