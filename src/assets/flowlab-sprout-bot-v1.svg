  />
  <path
    fill="#EFB338"
    d="M355 230c28-3 48 13 49 36 1 24-20 42-48 39-13-20-14-52-1-75Z"
  />

  <!-- Minimal bot face -->
  <rect x="213" y="211" width="16" height="35" rx="8" fill="#2B2644"/>
  <rect x="283" y="211" width="16" height="35" rx="8" fill="#2B2644"/>
  <path
    fill="none"
    stroke="#2B2644"
    stroke-width="12"
    stroke-linecap="round"
    d="M230 278c15 14 37 14 52 0"
  />

  <!-- Shared FlowLab broken-shell silhouette -->
  <path
    fill="#A7AEDF"
    d="M72 300l67 33 53-49 65 54 65-53 50 44 68-32c-5 101-81 168-184 168S77 397 72 300Z"
