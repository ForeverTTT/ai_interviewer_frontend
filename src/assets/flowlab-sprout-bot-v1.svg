    d="M263 125c2-31 19-61 43-76 20-12 44-6 54 14 10 20 1 44-20 57-22 13-50 15-77 5Z"
  />

  <!-- Soft stem joining the leaves to the seed body -->
  <path
    fill="#FCC648"
