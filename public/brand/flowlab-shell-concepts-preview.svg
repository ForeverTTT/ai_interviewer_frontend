<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 820" role="img" aria-labelledby="title desc">
  <title id="title">FlowLab white-shell 2D logo concepts</title>
  <desc id="desc">Three 2D directions for unifying the FlowLab logo with its white-shell felt character.</desc>
  <rect width="1440" height="820" fill="#FFF9EF"/>
  <circle cx="1175" cy="130" r="225" fill="#FFD864" opacity=".13"/>
  <circle cx="180" cy="710" r="210" fill="#C9B4FF" opacity=".12"/>
  <text x="92" y="95" fill="#26252B" font-family="Arial Rounded MT Bold, Arial, sans-serif" font-size="36" font-weight="800">FlowLab · 白色蛋壳二维标志提案</text>
  <text x="92" y="137" fill="#777582" font-family="Arial, sans-serif" font-size="17" letter-spacing="2">3D FELT CHARACTER → 2D BRAND MARK</text>

  <g transform="translate(78 205)">
    <rect width="400" height="500" rx="34" fill="#FFFFFF" stroke="#EEE6DA" stroke-width="2"/>
    <rect x="28" y="28" width="47" height="31" rx="15.5" fill="#FFD864"/><text x="51.5" y="50" text-anchor="middle" fill="#26252B" font-family="Arial" font-size="15" font-weight="700">A</text>
    <g transform="translate(104 75) scale(1.5)">
      <g fill="#FFD864"><rect x="76" y="5" width="9" height="22" rx="4.5" transform="rotate(17 80.5 16)"/><rect x="94" y="17" width="9" height="20" rx="4.5" transform="rotate(46 98.5 27)"/></g>
      <path fill="#FFD864" d="M28 57C30 35 45 22 64 22c21 0 37 15 38 38l7 22-18 26H37L19 83l9-26Z"/>
      <path fill="#FFF8E9" stroke="#E8DDC9" stroke-width="2.5" stroke-linejoin="round" d="M29 49C33 26 47 14 65 14c20 0 35 14 38 38-9 5-17-4-25 0-8 4-13 12-23 8-8-3-12-14-20-12-2 1-4 1-6 1Z"/>
      <path fill="#FFF8E9" stroke="#E8DDC9" stroke-width="2.5" stroke-linejoin="round" d="M18 78c9-7 16 5 25 0 9-6 17 8 27 1 9-6 17 5 25 0 6-4 11 1 15 6-4 21-22 34-46 34-25 0-43-14-46-41Z"/>
      <g fill="#26252B"><rect x="48" y="57" width="8" height="16" rx="4"/><rect x="72" y="57" width="8" height="16" rx="4"/></g>
    </g>
    <text x="32" y="340" fill="#26252B" font-family="Arial, sans-serif" font-size="25" font-weight="800">上下白壳</text>
    <text x="32" y="377" fill="#777582" font-family="Arial, sans-serif" font-size="17">最接近品牌图里的三维“破壳”动作</text>
    <text x="32" y="406" fill="#777582" font-family="Arial, sans-serif" font-size="17">主 Logo、图标、站内标识可以共用</text>
    <rect x="32" y="444" width="112" height="33" rx="16.5" fill="#EAF5E5"/><text x="88" y="466" text-anchor="middle" fill="#5B8F55" font-family="Arial" font-size="14" font-weight="700">推荐方向</text>
    <g transform="translate(300 424) scale(.43)">
      <g fill="#FFD864"><rect x="76" y="5" width="9" height="22" rx="4.5" transform="rotate(17 80.5 16)"/><rect x="94" y="17" width="9" height="20" rx="4.5" transform="rotate(46 98.5 27)"/></g><path fill="#FFD864" d="M28 57C30 35 45 22 64 22c21 0 37 15 38 38l7 22-18 26H37L19 83l9-26Z"/><path fill="#FFF8E9" stroke="#E8DDC9" stroke-width="2.5" d="M29 49C33 26 47 14 65 14c20 0 35 14 38 38-9 5-17-4-25 0-8 4-13 12-23 8-8-3-12-14-20-12-2 1-4 1-6 1Z"/><path fill="#FFF8E9" stroke="#E8DDC9" stroke-width="2.5" d="M18 78c9-7 16 5 25 0 9-6 17 8 27 1 9-6 17 5 25 0 6-4 11 1 15 6-4 21-22 34-46 34-25 0-43-14-46-41Z"/><rect x="48" y="57" width="8" height="16" rx="4" fill="#26252B"/><rect x="72" y="57" width="8" height="16" rx="4" fill="#26252B"/>
    </g>
  </g>

  <g transform="translate(520 205)">
    <rect width="400" height="500" rx="34" fill="#FFFFFF" stroke="#EEE6DA" stroke-width="2"/>
    <rect x="28" y="28" width="47" height="31" rx="15.5" fill="#F2EAFE"/><text x="51.5" y="50" text-anchor="middle" fill="#6E52A6" font-family="Arial" font-size="15" font-weight="700">B</text>
    <g transform="translate(104 75) scale(1.5)">
      <g fill="#FFD864"><rect x="78" y="6" width="9" height="22" rx="4.5" transform="rotate(17 82.5 17)"/><rect x="96" y="19" width="9" height="20" rx="4.5" transform="rotate(47 100.5 29)"/></g>
      <path fill="#FFF8E9" stroke="#E8DDC9" stroke-width="2.5" d="M64 17c26 0 45 20 46 49 1 34-17 53-46 53S17 99 18 66c1-29 20-49 46-49Z"/>
      <path fill="#FFD864" d="M26 54c5-22 19-34 38-34 20 0 35 13 39 37-8 5-14-5-22-1-8 5-13 14-23 9-8-3-12-15-20-12-5 2-8 2-12 1Z"/>
      <path fill="none" stroke="#E8DDC9" stroke-width="2.5" stroke-linecap="round" d="M25 55c5 2 9 1 13-1 8-3 12 9 20 12 10 5 15-4 23-9 8-4 14 6 23 1"/>
      <g fill="#26252B"><rect x="47" y="69" width="8" height="17" rx="4"/><rect x="73" y="69" width="8" height="17" rx="4"/></g>
    </g>
    <text x="32" y="340" fill="#26252B" font-family="Arial, sans-serif" font-size="25" font-weight="800">白壳正脸</text>
    <text x="32" y="377" fill="#777582" font-family="Arial, sans-serif" font-size="17">脸落在白壳上，最像目前教练团角色</text>
    <text x="32" y="406" fill="#777582" font-family="Arial, sans-serif" font-size="17">亲和，但和旧黄色“o”差异最大</text>
    <rect x="32" y="444" width="122" height="33" rx="16.5" fill="#F2EAFE"/><text x="93" y="466" text-anchor="middle" fill="#6E52A6" font-family="Arial" font-size="14" font-weight="700">角色感最强</text>
  </g>

  <g transform="translate(962 205)">
    <rect width="400" height="500" rx="34" fill="#FFFFFF" stroke="#EEE6DA" stroke-width="2"/>
    <rect x="28" y="28" width="47" height="31" rx="15.5" fill="#E5F5FF"/><text x="51.5" y="50" text-anchor="middle" fill="#427D9D" font-family="Arial" font-size="15" font-weight="700">C</text>
    <g transform="translate(104 75) scale(1.5)">
      <g fill="#FFD864"><rect x="78" y="7" width="9" height="21" rx="4.5" transform="rotate(17 82.5 17.5)"/><rect x="96" y="19" width="9" height="19" rx="4.5" transform="rotate(47 100.5 28.5)"/></g>
      <path fill="#FFF8E9" stroke="#E8DDC9" stroke-width="2.5" fill-rule="evenodd" d="M64 20c27 0 47 20 47 48s-20 48-47 48-47-20-47-48 20-48 47-48Zm0 16c-18 0-31 13-31 32s13 32 31 32 31-13 31-32-13-32-31-32Z"/>
      <ellipse cx="64" cy="68" rx="32" ry="33" fill="#FFD864"/>
      <path fill="#FFF8E9" stroke="#E8DDC9" stroke-width="2.5" stroke-linejoin="round" d="M34 50c7 4 12-6 20-2 8 4 10 13 20 10 7-2 12-10 20-5-5-12-16-19-30-19-13 0-24 6-30 16Z"/>
      <g fill="#26252B"><rect x="49" y="64" width="8" height="16" rx="4"/><rect x="71" y="64" width="8" height="16" rx="4"/></g>
    </g>
    <text x="32" y="340" fill="#26252B" font-family="Arial, sans-serif" font-size="25" font-weight="800">白壳环抱</text>
    <text x="32" y="377" fill="#777582" font-family="Arial, sans-serif" font-size="17">轮廓最集中，16–24px 小图标最稳定</text>
    <text x="32" y="406" fill="#777582" font-family="Arial, sans-serif" font-size="17">但“正在破壳”的动作感稍弱</text>
    <rect x="32" y="444" width="136" height="33" rx="16.5" fill="#E5F5FF"/><text x="100" y="466" text-anchor="middle" fill="#427D9D" font-family="Arial" font-size="14" font-weight="700">小尺寸最清晰</text>
  </g>

  <text x="92" y="775" fill="#777582" font-family="Arial, sans-serif" font-size="15">统一规则：二维标志只保留白壳、黄色内芯、深色眼睛与两道行动信号；毛毡纹理仅用于角色插画。</text>
</svg>
